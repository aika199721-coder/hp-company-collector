runtime:
  live_validation: true
  require_confirmation: true
  max_conditions: 1
  max_business_targets: 3
  max_candidates: 20
  max_http_requests: 50
  max_requests_per_domain: 10
  max_runtime_seconds: 900
crawler:
  playwright:
    enabled: false
  request_timeout_seconds: 15
  default_delay_seconds: 5
  max_redirects: 5
  max_response_bytes: 5242880
  consecutive_403_limit: 2
search:
  max_queries: 3
  max_results_per_query: 10
safety:
  stop_on_robots_error: true
  stop_on_rate_limit: true
  stop_on_captcha_signal: true
  stop_on_block_page_signal: true
