[project]
name = "hp-company-collector"
version = "0.10.0"
description = "Official website collector for Japanese sales prospects"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
